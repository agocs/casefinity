# Cloudflare Worker (Static Assets) config for the Hardcase Gridfinity generator.
# The app is fully static, so this is an "assets-only" Worker: there is no `main`
# script — the Worker just serves the Vite build output in dist/.
#
# Deploy command (in the Cloudflare build settings): npx wrangler deploy

name = "casefinity"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
